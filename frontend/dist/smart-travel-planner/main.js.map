<div class="register-wrapper d-flex align-items-center justify-content-center py-4">
  <div class="card shadow register-card">
    <div class="card-body p-4">
      <h3 class="card-title text-center mb-4">✈️ Create Account</h3>
      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Full Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="fullName" name="fullName" placeholder="Enter full name" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Username <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="username" name="username" placeholder="Choose a username" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Email <span class="text-danger">*</span></label>
          <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="Enter email" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Password <span class="text-danger">*</span></label>
          <input type="password" class="form-control" [(ngModel)]="password" name="password" placeholder="Create password" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input type="tel" class="form-control" [(ngModel)]="phone" name="phone" placeholder="Phone number (optional)" />
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          Register
        </button>
      </form>
      <p class="text-center mt-3 mb-0">
        Already have an account? <a routerLink="/login">Login</a>
      </p>
    </div>
  </div>
</div>
