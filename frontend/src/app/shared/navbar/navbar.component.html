<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/">
      ✈️ Smart Travel Planner
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/destinations" routerLinkActive="active">Destinations</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/hotels" routerLinkActive="active">Hotels</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/calculator" routerLinkActive="active">Cost Calculator</a>
        </li>
        <li class="nav-item" *ngIf="authService.isAuthenticated()">
          <a class="nav-link" routerLink="/itineraries/new" routerLinkActive="active">Plan Itinerary</a>
        </li>
        <li class="nav-item" *ngIf="authService.isAuthenticated()">
          <a class="nav-link" routerLink="/my-trips" routerLinkActive="active">My Trips</a>
        </li>
        <li class="nav-item" *ngIf="authService.isAdmin()">
          <a class="nav-link" routerLink="/admin" routerLinkActive="active">Admin</a>
        </li>
      </ul>
      <ul class="navbar-nav">
        <ng-container *ngIf="authService.isAuthenticated(); else guestLinks">
          <li class="nav-item">
            <span class="nav-link text-light">👤 {{ authService.getUsername() }}</span>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-light btn-sm ms-2" (click)="logout()">Logout</button>
          </li>
        </ng-container>
        <ng-template #guestLinks>
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">Login</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-outline-light btn-sm ms-2" routerLink="/register">Register</a>
          </li>
        </ng-template>
      </ul>
    </div>
  </div>
</nav>
