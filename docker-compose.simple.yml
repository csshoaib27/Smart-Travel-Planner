# Simplified Docker Compose for Smart Travel Planner
# This version starts services without building frontend/backend from source

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: smart-travel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_travel_db
      MYSQL_USER: travel_user
      MYSQL_PASSWORD: travel_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/database_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/02-data.sql
    networks:
      - smart-travel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  smart-travel-network:
    driver: bridge
